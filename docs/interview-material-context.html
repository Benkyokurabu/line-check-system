<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面談資料の画面設計</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Yu Gothic",sans-serif;background:#e2eeeb;color:#173d43}.head{height:58px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;background:#fff;border-bottom:1px solid #c3d8d2}.head a{color:#07586b}.stage{position:relative;height:calc(100vh - 58px);min-height:400px}.paper,.panel{position:absolute;inset:0;padding:36px 155px 80px 36px;overflow:auto}.paper{background:#fafafa}.paper .sheet{margin:auto;max-width:800px;min-height:760px;padding:56px;background:#fff;box-shadow:0 5px 20px #17333d20}.panel{background:#f8fbfa}.panel[hidden],.paper[hidden]{display:none}.panel article,.panel dl div{max-width:850px;margin:16px 0;padding:18px;border:1px solid #d5e2e3;border-radius:10px;background:#fff}.panel h2{font-size:1.45rem}.panel h3{margin:0 0 6px}.panel p{line-height:1.7}.panel dt{font-weight:700;color:#07586b}.panel dd{margin:5px 0}.dock{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;padding:9px;border:1px solid #b6d0ca;border-radius:18px;background:#e6f1eeef;box-shadow:0 8px 28px #17333d30}.dock button{width:106px;height:42px;border:1px solid #b6d0ca;border-radius:12px;background:#fff;color:#07586b;font-size:14px;font-weight:700;cursor:pointer;transform-origin:right center;transition:transform .2s,box-shadow .2s}.dock button:hover,.dock button:focus-visible{transform:translateX(-7px) scale(1.22);box-shadow:0 7px 17px #17333d2b}.dock button[aria-pressed=true]{background:#07586b;color:#fff}.note{font-size:.85rem;color:#536870}@media(max-width:700px){.paper,.panel{padding:18px 15px 86px}.dock{top:auto;bottom:8px;left:8px;right:8px;transform:none;flex-direction:row;overflow:auto}.dock button{flex:none;width:98px}}
</style></head><body><header class="head"><strong id="title">指導簿</strong><a href="#">一式PDFを表示・印刷</a></header><main class="stage"><section class="paper" id="paper"><div class="sheet"><h1>指導簿</h1><p>ここには実際のPDFをそのまま表示します。</p><p class="note">この設計画面は表示と操作の確認用です。</p></div></section><section class="panel" id="records" hidden><h2>面談記録</h2><p>Notionの面談DBから取得した文章を新しい順に表示します。</p><article><h3>進路相談</h3><p class="note">2026-05-23　原本へのリンク</p><p>志望校と今後の学習方針を確認した。</p></article></section><section class="panel" id="info" hidden><h2>情報</h2><p>AIが面談前に知っておきたい記載を選び、出典を示します。</p><article><h3>AIが選んだ特記事項</h3><p>面談の連絡は保護者へ。</p><p class="note">出典：生徒情報DB「連絡先　備考」</p></article><h3>生徒情報DBの元の記載</h3><dl><div><dt>連絡先　備考</dt><dd>面談の連絡は保護者へ。</dd></div></dl></section><nav class="dock" aria-label="資料を切り替える"><button aria-pressed="true" data-view="paper">指導簿</button><button aria-pressed="false" data-view="records">面談記録</button><button aria-pressed="false" data-view="info">情報</button></nav></main><script>const names={paper:'指導簿',records:'面談記録',info:'情報'};document.querySelectorAll('.dock button').forEach(button=>button.addEventListener('click',()=>{for(const id of Object.keys(names))document.getElementById(id).hidden=id!==button.dataset.view;document.querySelectorAll('.dock button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));document.getElementById('title').textContent=names[button.dataset.view]}));</script></body></html>
