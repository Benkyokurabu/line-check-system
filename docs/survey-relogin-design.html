<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面談の再ログイン導線</title><style>body{font-family:system-ui;background:#edf3f7;color:#17283b;margin:0;padding:20px}main{max-width:700px;margin:auto}section{background:white;border-radius:12px;padding:20px;margin:16px 0}button{background:#175786;color:white;border:0;border-radius:8px;padding:14px;font:inherit;cursor:pointer;min-height:44px}input,textarea{display:block;box-sizing:border-box;width:100%;padding:12px;font:inherit;margin:10px 0;border:1px solid #a8b8c6}p{line-height:1.7}[hidden]{display:none}</style><main><h1>アンケートから面談を進める</h1><p>画面の流れ：回答を選ぶ → 認証期限切れ → この画面で職員ログイン → 同じ回答と入力内容へ戻る</p><section id="login"><h2>この画面でログインし直す</h2><p>選んだアンケートと入力途中の内容を保持して、面談を再開します。</p><button id="entry">工藤さんの入口</button><form hidden id="form"><label>パスワード<input type="password" value="sample" required></label><button>ログインして面談を再開</button></form></section><section id="record" hidden><h2>面談記録</h2><p role="status">ログインしました。入力内容を確認してから、保存・送信してください。</p><label>面談内容<textarea>入力途中の面談メモ</textarea></label><button id="expire">認証期限切れを試す</button></section><p>これは設計見本です。実際の認証・保存・LINE送信は行いません。</p></main><script>entry.onclick=()=>form.hidden=false;form.onsubmit=e=>{e.preventDefault();login.hidden=true;record.hidden=false};expire.onclick=()=>{login.hidden=false;record.hidden=true};</script></html>
