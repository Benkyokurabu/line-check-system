<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面談資料</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#173d43}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #147b83;outline-offset:3px}.landing{padding:24px}.landing button,.head button{padding:7px 12px;border:1px solid #9fbcb7;border-radius:8px;background:#fff;cursor:pointer}.viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:#dce7e5}.viewer[hidden]{display:none}.head{flex:none;min-height:54px;padding:7px 14px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border-bottom:1px solid #b8d1cc}.head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.head div{display:flex;align-items:center;gap:12px;flex:none}.head a{color:#07586b;font-size:.85rem}.area{position:relative;flex:1;min-height:0}.pdf{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden;pointer-events:none}.pdf.active{visibility:visible;pointer-events:auto}.dock{position:absolute;right:14px;top:50%;display:flex;flex-direction:column;gap:7px;max-height:calc(100% - 24px);padding:9px;overflow-y:auto;transform:translateY(-50%);border:1px solid #b6d0ca;border-radius:18px;background:#e6f1eeef;box-shadow:0 8px 28px #17333d30}.dock button{position:relative;width:106px;height:42px;flex:none;padding:0;border:1px solid #b6d0ca;border-radius:12px;background:#fff;color:#07586b;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:0 3px 9px #17333d16;transform-origin:right center;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s;cursor:pointer}.dock button:hover,.dock button:focus-visible{transform:translateX(-7px) scale(1.22);box-shadow:0 7px 17px #17333d2b;z-index:3}.dock button.near{transform:translateX(-2px) scale(1.06);z-index:2}.dock button[aria-pressed=true]{background:#07586b;color:#fff;border-color:#07586b}.dock button::after{content:attr(data-label);position:absolute;right:calc(100% + 14px);top:50%;width:max-content;max-width:220px;padding:7px 10px;border-radius:7px;background:#173d43;color:#fff;font-size:12px;line-height:1.4;white-space:normal;text-align:left;opacity:0;pointer-events:none;transform:translate(5px,-50%);transition:opacity .18s,transform .18s}.dock button:hover::after,.dock button:focus-visible::after{opacity:1;transform:translate(0,-50%)}@media(max-width:700px){.head{gap:6px;padding:5px 8px}.head strong{font-size:.85rem}.head div{gap:5px}.head a{font-size:.7rem}.head button{padding:6px;font-size:.75rem}.dock{top:auto;right:8px;bottom:8px;left:8px;max-height:none;flex-direction:row;transform:none;overflow-x:auto;overflow-y:hidden}.dock button{width:98px;height:40px;font-size:13px;transform-origin:center bottom}.dock button:hover,.dock button:focus-visible{transform:translateY(-3px) scale(1.09)}.dock button::after{display:none}}@media(prefers-reduced-motion:reduce){.dock button,.dock button::after{transition:none}}
</style></head><body>
<div class="landing"><h1 id="student-title">面談資料</h1><button id="reopen" type="button">資料を開く</button><p>先生用の資料です。</p></div>
<main class="viewer" id="viewer" aria-label="面談資料のPDFプレビュー"><header class="head"><strong id="title">面談資料</strong><div><a id="current-pdf" target="_blank" rel="noopener">このPDFを別画面で開く</a><a href="staff-bundle.pdf#zoom=100&navpanes=0" target="_blank" rel="noopener">一式PDFを表示・印刷</a><button id="close" type="button">閉じる ×</button></div></header><div class="area" id="area"><nav class="dock" id="dock" aria-label="資料を切り替える"></nav></div></main>
<script>
const items=__ITEMS_JSON__,studentName=__STUDENT_NAME_JSON__,viewer=document.getElementById('viewer'),area=document.getElementById('area'),dock=document.getElementById('dock'),frames=new Map(),recent=[];document.title=`${studentName}の面談資料`;document.getElementById('student-title').textContent=`${studentName}の面談資料`;
function short(label){return label.includes('アンケート')?'アンケート':label.includes('指導簿')?'指導簿':/晶文社|高校案内/.test(label)?'晶文社':/実施内容|選抜基準|推薦基準/.test(label)?'実施内容':/併願校|併願状況/.test(label)?'併願校':/北辰基礎資料|北辰偏差値資料/.test(label)?'北辰基礎資料':label.includes('北辰')?'北辰成績':label.includes('成績通知')?'塾内成績':label.includes('志望校')?'志望校':label.includes('Vもぎ')?'Vもぎ':'資料'}
const buttons=items.map((item,index)=>{const button=document.createElement('button');button.type='button';button.textContent=short(item.label);button.dataset.label=item.label;button.title=item.label;button.setAttribute('aria-label',`${item.label}を表示`);button.addEventListener('mousemove',()=>{buttons.forEach((other,i)=>other.classList.toggle('near',Math.abs(index-i)===1));show(index)});button.addEventListener('mouseleave',()=>buttons.forEach(other=>other.classList.remove('near')));button.addEventListener('focus',()=>show(index));button.addEventListener('click',()=>show(index));button.addEventListener('keydown',event=>{if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();buttons[(index+(event.key==='ArrowDown'||event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length].focus()});dock.append(button);return button});
function frameFor(index){if(frames.has(index))return frames.get(index);const frame=document.createElement('iframe');frame.className='pdf';frame.title=`${items[index].label}のPDFプレビュー`;frame.src=`material-${index}.pdf#zoom=100&navpanes=0`;area.prepend(frame);frames.set(index,frame);recent.push(index);if(recent.length>12){const old=recent.shift();frames.get(old)?.remove();frames.delete(old)}return frame}
function show(index){frameFor(index);for(const [i,frame] of frames)frame.classList.toggle('active',i===index);buttons.forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));document.getElementById('title').textContent=items[index].label;document.getElementById('current-pdf').href=`material-${index}.pdf#zoom=100&navpanes=0`}
document.getElementById('close').onclick=()=>viewer.hidden=true;document.getElementById('reopen').onclick=()=>viewer.hidden=false;document.addEventListener('keydown',event=>{if(event.key==='Escape')viewer.hidden=true});if(items.length){show(0);setTimeout(()=>{for(let i=1;i<Math.min(items.length,8);i++)frameFor(i)},100)}
</script></body></html>
