<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面談後のLINE送信</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f8f5;color:#183b35;font:16px/1.8 system-ui,sans-serif}main{max-width:800px;margin:auto;padding:30px 18px}h1{font-size:27px}.flow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0}.step{background:#17775d;color:white;padding:12px 18px;border-radius:10px}.card{background:white;border:1px solid #cbded2;border-radius:14px;padding:24px;margin:20px 0}label{display:block;margin:12px 0}textarea{width:100%;font:inherit;border:1px solid #adc8b7;border-radius:8px;min-height:150px;padding:12px}button,a{font:inherit;display:inline-block;padding:12px 18px;border-radius:8px}button{background:#17775d;color:white;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:default}input{width:19px;height:19px;vertical-align:middle}small{color:#5b7267}.note{background:#fff5dc;padding:12px;border-radius:9px}@media(max-width:500px){.card{padding:16px}.step{padding:8px 12px}.flow{gap:6px}}
</style><main><h1>面談後のLINE送信</h1><p>送り先と本文が分かれば、そのまま送信できます。</p><div class="flow" aria-label="送信の手順"><span class="step">① 送り先を選ぶ</span><span>→</span><span class="step">② 本文を見る・直す</span><span>→</span><span class="step">③ 送信する</span></div>
<p>Notionへの反映や、共有文の「確定」、本人・続柄の確認登録、送信前の確認チェックは必須にしません。選んだ生徒に登録された送り先を使います。</p>
<section class="card"><h2>操作を試す</h2><p class="note">これは検証用の架空例です。実際のLINEは送信しません。</p><label><input id="recipient" type="checkbox"> 見本の生徒のお母様</label><label>本文<textarea id="message">本日はご面談ありがとうございました。
次回の面談日について、改めてご連絡します。

勉強クラブ</textarea></label><button id="send" disabled>送信する</button><p id="result" role="status"></p></section>
<p>送信結果は送り先ごとに保存します。同じ本文の二重送信を防ぎ、受付結果が分からない場合は自動で再送しません。連絡先の確認登録や、公式LINE画面で送った分の記録は「送り先の管理・送信済みの記録」から必要に応じて行えます。</p>
<a href="https://line-check-system.vercel.app/staff/survey-workflow/post-interview">勉たんで開く</a></main>
<script>const recipient=document.querySelector('#recipient'),message=document.querySelector('#message'),send=document.querySelector('#send'),result=document.querySelector('#result');let sent='';function update(){const same=sent===message.value.trim();send.disabled=!recipient.checked||!message.value.trim()||message.value.length>5000||same;send.textContent=same?'送信済み':'送信する'}recipient.addEventListener('change',update);message.addEventListener('input',update);send.addEventListener('click',()=>{sent=message.value.trim();result.textContent='架空例：お母様への送信結果を保存しました。';update()});</script></html>
