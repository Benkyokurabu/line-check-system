<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>録画公開：同じテストを使う両教室の判定</title><style>body{font:16px/1.7 system-ui;margin:0;background:#f3f6fb;color:#172b45}main{max-width:740px;margin:32px auto;padding:24px;background:white;border-radius:20px}h1{font-size:24px}section{background:#f2f6fd;border-radius:12px;padding:16px;margin:16px 0}label{display:block;margin:8px 0}input{width:20px;height:20px;vertical-align:middle}output{display:block;padding:20px;background:#fff0e5;border-radius:12px;font-weight:bold}output.public{background:#dbf7e9}small{display:block}svg{width:100%;height:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #dde3ed}@media(max-width:500px){main{margin:12px;padding:16px}h1{font-size:21px}}</style><main><h1>同じテストは両教室の完了後に公開</h1><p>例：本校1S数学（10月1日）と南教室1S数学（10月5日）の単元テスト③。実施日が違っていても、同じ学年・クラス・科目・テスト回をまとめます。</p><svg viewBox="0 0 680 180" role="img" aria-label="各教室でいずれかのチェック完了、両教室が完了すると両録画公開"><g fill="#e6efff" stroke="#91add6"><rect x="10" y="15" width="250" height="65" rx="12"/><rect x="10" y="100" width="250" height="65" rx="12"/><rect x="415" y="55" width="245" height="70" rx="12"/></g><g font-family="system-ui" font-size="17" fill="#172b45" text-anchor="middle"><text x="135" y="42">本校：どちらかにチェック</text><text x="135" y="65">欠席なし OR 振替者採点・入力</text><text x="135" y="127">南教室：どちらかにチェック</text><text x="135" y="150">欠席なし OR 振替者採点・入力</text><text x="337" y="96">両方完了 →</text><text x="538" y="96">両教室の録画を公開</text></g></svg><section><h2>本校</h2><label><input type="checkbox" id="h1">欠席なし</label><label><input type="checkbox" id="h2">振替者採点・入力</label></section><section><h2>南教室</h2><label><input type="checkbox" id="s1">欠席なし</label><label><input type="checkbox" id="s2">振替者採点・入力</label></section><output id="result" aria-live="polite">両教室の録画：非公開</output><p>片方だけ完了しても公開しません。片方のチェックを両方外すと、再び両録画を非公開にします。</p><table><thead><tr><th>対象</th><th>判定</th></tr></thead><tbody><tr><td>同じ名前・同じテスト</td><td>対象教室すべての完了を待つ</td></tr><tr><td>片方だけに存在する授業</td><td>その教室の完了で公開</td></tr><tr><td>進捗行が未確認・重複・取得失敗</td><td>非公開を維持</td></tr><tr><td>手動の公開設定</td><td>非公開・日時指定・今すぐ公開を維持</td></tr></tbody></table><small>この図のチェックは説明用です。実際のNotion・録画設定には書き込みません。</small></main><script>const result=document.querySelector('#result');function update(){const ready=(h1.checked||h2.checked)&&(s1.checked||s2.checked);result.textContent='両教室の録画：'+(ready?'公開':'非公開');result.classList.toggle('public',ready)}document.querySelectorAll('input').forEach(input=>input.addEventListener('change',update));</script></html>
