<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>面談資料を2台のPCで使う</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:24px;color:#172735;background:#f5f8f8}h1{font-size:1.7rem}main{display:grid;gap:16px}.card{padding:20px;border:1px solid #cadbdd;border-radius:14px;background:white}.flow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.step{flex:1;min-width:170px;padding:15px;border-radius:10px;background:#e4f3f1}.arrow{font-size:1.5rem;color:#07586b}button{background:#07586b;color:white;border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}button:disabled{background:#62868d}#result{overflow-wrap:anywhere;color:#07586b;font-weight:700}@media(max-width:520px){.flow{display:grid}.arrow{text-align:center;transform:rotate(90deg)}}
</style>
<h1>面談資料を2台のPCで使う</h1>
<main>
<section class="card"><h2>資料作成の流れ</h2><div class="flow"><div class="step">使用中のPC<br><strong>勉たん画面</strong></div><span class="arrow">→</span><div class="step">そのPCの補助アプリ<br><strong>NASから資料を作成</strong></div><span class="arrow">→</span><div class="step">必要な資料だけ<br><strong>OneDriveに保存</strong></div></div></section>
<section class="card"><h2>画面操作の確認</h2><p>資料を確認して残す場合だけ保存します。一時PDFは約15分で消えます。</p><button id="save">OneDriveに保存</button><p id="result" role="status">保存前</p></section>
<section class="card"><h2>保存先</h2><p><code>OneDrive\面談準備\保存済み資料</code>。日時と学籍番号に重複防止IDを加え、2台から保存しても上書きしません。切り替える前にOneDriveの同期完了を確認します。</p><p>元資料はNAS、補助アプリは各PCに置きます。</p></section>
</main>
<script>document.getElementById('save').addEventListener('click',event=>{event.currentTarget.disabled=true;event.currentTarget.textContent='OneDriveに保存済み';document.getElementById('result').textContent='保存済み：OneDrive\\面談準備\\保存済み資料\\20260926_2018999_面談資料.pdf';});</script>
</html>
