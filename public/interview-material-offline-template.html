<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面談資料</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#173d43}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #147b83;outline-offset:3px}.landing{padding:24px}.landing button,.head button{padding:7px 12px;border:1px solid #9fbcb7;border-radius:8px;background:#fff;cursor:pointer}.viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:#dce7e5}.viewer[hidden]{display:none}.head{flex:none;min-height:54px;padding:7px 14px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border-bottom:1px solid #b8d1cc}.head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.head div{display:flex;align-items:center;gap:12px;flex:none}.head a{color:#07586b;font-size:.85rem}.area{position:relative;flex:1;min-height:0}.pdf{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden;pointer-events:none}.pdf.active{visibility:visible;pointer-events:auto}.dock{position:absolute;right:14px;top:50%;display:flex;flex-direction:column;gap:7px;max-height:calc(100% - 24px);padding:9px;overflow-y:auto;transform:translateY(-50%);border:1px solid #b6d0ca;border-radius:18px;background:#e6f1eeef;box-shadow:0 8px 28px #17333d30}.dock button{position:relative;width:106px;height:42px;flex:none;padding:0;border:1px solid #b6d0ca;border-radius:12px;background:#fff;color:#07586b;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:0 3px 9px #17333d16;transform-origin:right center;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s;cursor:pointer}.dock button:hover,.dock button:focus-visible{transform:translateX(-7px) scale(1.22);box-shadow:0 7px 17px #17333d2b;z-index:3}.dock button.near{transform:translateX(-2px) scale(1.06);z-index:2}.dock button[aria-pressed=true]{background:#07586b;color:#fff;border-color:#07586b}.dock button::after{content:attr(data-label);position:absolute;right:calc(100% + 14px);top:50%;width:max-content;max-width:220px;padding:7px 10px;border-radius:7px;background:#173d43;color:#fff;font-size:12px;line-height:1.4;white-space:normal;text-align:left;opacity:0;pointer-events:none;transform:translate(5px,-50%);transition:opacity .18s,transform .18s}.dock button:hover::after,.dock button:focus-visible::after{opacity:1;transform:translate(0,-50%)}.text-panel{position:absolute;inset:0;overflow:auto;padding:28px 145px 80px 28px;background:#f8fbfa;line-height:1.7}.text-panel[hidden]{display:none}.text-panel h2{margin:0 0 8px}.text-panel article,.text-panel dl>div{margin:16px 0;padding:18px;border:1px solid #d5e2e3;border-radius:10px;background:#fff}.text-panel article h3{margin:0}.text-panel article p{margin:3px 0 12px;color:#536870;font-size:.88rem}.text-panel .body,.text-panel dd{white-space:pre-wrap;overflow-wrap:anywhere}.text-panel dt{font-weight:700;color:#07586b}.text-panel dd{margin:5px 0 0}.text-panel a{color:#07586b}@media(max-width:700px){.head{gap:6px;padding:5px 8px}.head strong{font-size:.85rem}.head div{gap:5px}.head a{font-size:.7rem}.head button{padding:6px;font-size:.75rem}.dock{top:auto;right:8px;bottom:8px;left:8px;max-height:none;flex-direction:row;transform:none;overflow-x:auto;overflow-y:hidden}.dock button{width:98px;height:40px;font-size:13px;transform-origin:center bottom}.dock button:hover,.dock button:focus-visible{transform:translateY(-3px) scale(1.09)}.dock button::after{display:none}.text-panel{padding:20px 15px 85px}}@media(prefers-reduced-motion:reduce){.dock button,.dock button::after{transition:none}}
.landing{max-width:840px;margin:auto;line-height:1.7}.landing ul{padding-left:24px}.landing li{margin:8px 0;overflow-wrap:anywhere}.landing a{color:#07586b}.pdf-help{position:absolute;z-index:2;left:14px;bottom:14px;max-width:min(480px,calc(100% - 160px));margin:0;padding:10px 14px;border:1px solid #9fbcb7;border-radius:10px;background:#fffffff2;box-shadow:0 3px 12px #17333d25}.pdf-help[hidden]{display:none}.pdf-help a{font-weight:700;color:#07586b}@media(max-width:700px){.pdf-help{left:8px;bottom:76px;max-width:calc(100% - 16px);font-size:.85rem}}
.head{justify-content:flex-start}.head .back{flex:none;min-height:44px;padding:9px 14px;border-color:#07586b;background:#07586b;color:#fff;font-weight:700}.head strong{min-width:0}.head div{margin-left:auto}@media(max-width:700px){.head{flex-wrap:wrap}.head .back{min-height:44px;padding:8px 10px;font-size:.88rem}.head strong{flex:1}.head div{width:100%;justify-content:flex-end;flex-wrap:wrap}.head a{font-size:.8rem}}
</style></head><body>
<style>
.school-filters{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:12px;margin:20px 0}.school-filters label{font-weight:700}.school-filters input,.school-filters select{display:block;width:100%;min-height:44px;margin-top:6px;padding:10px;border:1px solid #9fbcb7;border-radius:8px;background:#fff;color:#173d43;font:inherit}.school-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.school-list button{position:relative;display:flex;flex-direction:column;gap:5px;min-height:78px;text-align:left;padding:14px 65px 14px 15px;border:1px solid #b6d0ca;border-radius:10px;background:#fff;color:#173d43;font:inherit;cursor:pointer}.school-list button:hover,.school-list button:focus-visible{background:#eaf7f3;border-color:#07586b}.school-list small{color:#536870}.school-list span{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#07586b;font-size:.8rem;font-weight:700}.head .school-toc{min-height:44px;border-color:#07586b;font-weight:700;color:#07586b}.landing #school-open{margin:8px 0 8px 10px;min-height:44px;font-weight:700;color:#07586b}@media(max-width:700px){.school-filters{grid-template-columns:minmax(0,1fr) 110px}.school-list{grid-template-columns:1fr}}
</style>
<div class="landing"><h1 id="student-title">面談資料</h1><p>このフォルダだけで使える先生用の資料です。保存後はネット接続なしでPDF・面談記録・生徒情報を確認できます。下の資料名からPDFを直接開けます。別タブで開いたPDFから戻るときは、元の面談資料のタブを選んでください。</p><button id="reopen" type="button">資料を画面で見る</button><h2>保存した資料</h2><ul id="saved-files"></ul><p><a href="staff-bundle.pdf" target="_blank" rel="noopener">印刷用の一式PDFを開く</a> ／ <a href="面談記録.txt" target="_blank" rel="noopener">面談記録の全文を開く</a> ／ <a href="生徒情報・注意点.txt" target="_blank" rel="noopener">生徒情報・注意点を開く</a></p></div>
<main class="viewer" id="viewer" aria-label="面談資料のプレビュー" hidden><header class="head"><button class="back" id="close" type="button">← 表紙に戻る</button><strong id="title">面談資料</strong><div><a id="current-source" target="_blank" rel="noopener">このPDFを直接開く</a><a href="staff-bundle.pdf#zoom=100&navpanes=0" target="_blank" rel="noopener">一式PDFを表示・印刷</a></div></header><div class="area" id="area"><section class="text-panel" id="text-panel" hidden></section><p class="pdf-help" id="pdf-help">PDFが枠内に表示されない場合は、<a id="direct-pdf" target="_blank" rel="noopener">このPDFを直接開く</a>から確認できます。</p><nav class="dock" id="dock" aria-label="資料を切り替える"></nav></div></main>
<script src="AI要約.js"></script>
<script>
const items=__ITEMS_JSON__,studentName=__STUDENT_NAME_JSON__,context=__CONTEXT_JSON__,viewer=document.getElementById('viewer'),area=document.getElementById('area'),dock=document.getElementById('dock'),panel=document.getElementById('text-panel'),source=document.getElementById('current-source'),frames=new Map(),recent=[];
const schools=context.schoolLibrary||[];
let schoolQuery='',schoolCategory='全て';
if(schools.length){const openSchools=document.createElement('button');openSchools.id='school-open';openSchools.type='button';openSchools.textContent=`北辰基礎資料の目次（全${schools.length}件）`;openSchools.onclick=()=>{viewer.hidden=false;show('schools')};document.getElementById('reopen').after(openSchools);const toc=document.createElement('button');toc.type='button';toc.className='school-toc';toc.textContent='北辰基礎資料の目次';toc.onclick=()=>show('schools');source.before(toc)}
document.title=`${studentName}の面談資料`;document.getElementById('student-title').textContent=`${studentName}の面談資料`;
if(context.capturedAt){const captured=document.createElement('p');captured.textContent=`記録・生徒情報の取得日時：${new Date(context.capturedAt).toLocaleString('ja-JP')}`;document.getElementById('student-title').after(captured)}
for(const [index,item] of items.entries()){const row=document.createElement('li'),link=document.createElement('a');link.href=`material-${index}.pdf`;link.target='_blank';link.rel='noopener';link.textContent=item.label;row.append(link);document.getElementById('saved-files').append(row)}
function short(item){const label=item.label;return item.kind|| (label.includes('アンケート')?'アンケート':label.includes('指導簿')?'指導簿':/晶文社|高校案内/.test(label)?'晶文社':/実施内容|選抜基準|推薦基準/.test(label)?'実施内容':/併願校|併願状況/.test(label)?'併願校':/北辰基礎資料|北辰偏差値資料/.test(label)?'北辰基礎資料':label.includes('北辰')?'北辰成績':label.includes('成績通知')?'塾内成績':label.includes('志望校')?'志望校':label.includes('Vもぎ')?'Vもぎ':'資料')}
let currentTab=null,appliedSummary='';
const originalHash=context.summary?.sourceHash;
function refreshSavedSummary(){const snapshot=window.__INTERVIEW_AI_SNAPSHOT__;if(!snapshot||snapshot.sourceHash!==originalHash||snapshot.summary?.status!=='completed')return;const version=JSON.stringify(snapshot.summary);if(appliedSummary===version)return;appliedSummary=version;context.summary=snapshot.summary;if(currentTab==='records')renderRecords();if(currentTab==='info')renderInfo();}
const tabs=[...items.map((_,index)=>index),...(schools.length?['schools']:[]),'records','info'];
const buttons=tabs.map((tab,index)=>{const label=typeof tab==='number'?short(items[tab]):tab==='schools'?'学校目次':tab==='records'?'面談記録':'情報',full=typeof tab==='number'?items[tab].label:tab==='schools'?'北辰基礎資料の全学校目次':label;const button=document.createElement('button');button.type='button';button.textContent=label;button.dataset.label=full;button.title=full;button.setAttribute('aria-label',`${full}を表示`);button.addEventListener('mousemove',()=>{buttons.forEach((other,i)=>other.classList.toggle('near',Math.abs(index-i)===1));if(currentTab!==tab)show(tab)});button.addEventListener('mouseleave',()=>buttons.forEach(other=>other.classList.remove('near')));button.addEventListener('focus',()=>show(tab));button.addEventListener('click',()=>show(tab));button.addEventListener('keydown',event=>{if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();buttons[(index+(event.key==='ArrowDown'||event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length].focus()});dock.append(button);return button});
function pdfDetails(tab){if(typeof tab==='number')return {label:items[tab].label,file:`material-${tab}.pdf`};const school=schools.find(item=>`school:${item.id}`===tab);return school?{label:`${school.school} ／ ${school.year}年度 北辰基礎資料`,file:school.file}:null}
function frameFor(tab){if(frames.has(tab))return frames.get(tab);const item=pdfDetails(tab);const frame=document.createElement('iframe');frame.className='pdf';frame.title=`${item.label}のPDFプレビュー`;frame.src=`${item.file}#zoom=100&navpanes=0`;area.prepend(frame);frames.set(tab,frame);recent.push(tab);if(recent.length>12){const old=recent.shift();frames.get(old)?.remove();frames.delete(old)}return frame}
function addText(parent,tag,value){const element=document.createElement(tag);element.textContent=value;parent.append(element);return element}
function schoolKey(value){return String(value).normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,char=>String.fromCharCode(char.charCodeAt(0)-0x60)).replace(/[\s　]/g,'')}
function renderSchools(){panel.replaceChildren();addText(panel,'h2','北辰基礎資料の目次');addText(panel,'p','全学校・学科から選べます。学校ごとに新しい年度を優先しています。');const filters=document.createElement('div');filters.className='school-filters';const searchLabel=addText(filters,'label','学校名で検索');const search=document.createElement('input');search.type='search';search.placeholder='例：川口、叡明';search.value=schoolQuery;searchLabel.append(search);const categoryLabel=addText(filters,'label','学校の種類');const category=document.createElement('select');for(const name of ['全て','公立','私立','その他']){const option=addText(category,'option',name);option.value=name}category.value=schoolCategory;categoryLabel.append(category);panel.append(filters);const count=addText(panel,'p','');count.setAttribute('role','status');const list=document.createElement('div');list.className='school-list';panel.append(list);function update(){schoolQuery=search.value;schoolCategory=category.value;const tokens=schoolKey(schoolQuery).split(/[、,]/).filter(Boolean);const matches=schools.filter(item=>(schoolCategory==='全て'||schoolCategory===item.category)&&tokens.every(token=>schoolKey(`${item.school}${item.reading||''}`).includes(token)));count.textContent=`${matches.length}件 / 全${schools.length}件`;list.replaceChildren();for(const item of matches){const button=document.createElement('button');button.type='button';button.setAttribute('aria-label',`${item.school}の北辰基礎資料を表示`);addText(button,'strong',item.school);addText(button,'small',`${item.category} ／ ${item.year}年度`);const arrow=addText(button,'span','開く →');arrow.setAttribute('aria-hidden','true');button.onclick=()=>show(`school:${item.id}`);list.append(button)}if(!matches.length)addText(list,'p','該当する学校はありません。学校名や絞り込みを変更してください。')}search.oninput=update;category.onchange=update;update()}
function renderSummary(){if(context.summary?.status==='completed'){addText(panel,'h3','面談前に確認したい点（AI）');if(!context.summary.items.length)addText(panel,'p','特記する項目はありませんでした。');for(const item of context.summary.items){const article=document.createElement('article');addText(article,'strong',item.note);addText(article,'p',`出典：${item.source}`);panel.append(article)}}else addText(panel,'p','AIによる注意点の抽出は保存時点で完了していません。面談記録と生徒情報の原文を確認してください。')}
function renderRecords(){panel.replaceChildren();addText(panel,'h2','面談記録');addText(panel,'p','Notionから取得した直近3回の全文を保存しています。');renderSummary();if(!context.records.length)addText(panel,'p','面談記録は見つかりませんでした。');for(const record of context.records){const article=document.createElement('article');addText(article,'h3',record.title);const date=addText(article,'p',record.date||'日付なし');const link=document.createElement('a');link.href=record.url;link.target='_blank';link.rel='noopener';link.textContent=' 原本';date.append(link);if(record.method||record.purpose)addText(article,'p',`方法：${record.method||'記載なし'} ／ 目的：${record.purpose||'記載なし'}`);const body=addText(article,'div',record.body||'本文はありません。');body.className='body';if(record.attachments?.length)addText(article,'p',`添付ファイル：${record.attachments.join('、')}（原本から確認）`);panel.append(article)}}
function renderInfo(){panel.replaceChildren();addText(panel,'h2','情報');addText(panel,'p','取得時点の生徒情報DBの記載です。');if(context.showPastSchools){addText(panel,'h3','過去の面談で話題に出た高校');addText(panel,'p','アンケートに志望校の記載がありません。以下は志望校として確定した情報ではありません。');if(!context.schoolMentions?.length)addText(panel,'p','高校名への言及は見つかりませんでした。');for(const mention of context.schoolMentions??[]){const row=document.createElement('article');addText(row,'p',mention.text);const source=addText(row,'p',`${mention.date||'日付なし'}・`);const link=document.createElement('a');link.href=mention.url;link.target='_blank';link.rel='noopener';link.textContent='Notion原本';source.append(link);panel.append(row)}}renderSummary();if(!context.info.length)addText(panel,'p','該当する記載はありません。');addText(panel,'h3','生徒情報DBの元の記載');const list=document.createElement('dl');for(const item of context.info){const row=document.createElement('div');addText(row,'dt',item.source);addText(row,'dd',item.value);list.append(row)}panel.append(list)}
function show(tab){currentTab=tab;const pdf=pdfDetails(tab);const isPdf=Boolean(pdf);if(isPdf)frameFor(tab);for(const [i,frame] of frames)frame.classList.toggle('active',isPdf&&i===tab);buttons.forEach((button,i)=>button.setAttribute('aria-pressed',String(tabs[i]===tab)));panel.hidden=isPdf;if(tab==='schools')renderSchools();if(tab==='records')renderRecords();if(tab==='info')renderInfo();document.getElementById('title').textContent=isPdf?pdf.label:tab==='schools'?'北辰基礎資料の目次':tab==='records'?'面談記録':'情報';const url=isPdf?`${pdf.file}#zoom=100&navpanes=0`:tab==='schools'?null:tab==='records'?context.records[0]?.url:context.studentUrl;source.hidden=!url;if(url)source.href=url;source.textContent=isPdf?'このPDFを直接開く':'Notionの原本を開く';const help=document.getElementById('pdf-help');help.hidden=!isPdf;if(isPdf)document.getElementById('direct-pdf').href=pdf.file}
function closeViewer(){viewer.hidden=true;document.getElementById('reopen').focus()}
refreshSavedSummary();setInterval(()=>{const script=document.createElement('script');script.src=`AI要約.js?updated=${Date.now()}`;script.onload=()=>{refreshSavedSummary();script.remove()};script.onerror=()=>script.remove();document.body.append(script)},5000);
document.getElementById('close').onclick=closeViewer;document.getElementById('reopen').onclick=()=>viewer.hidden=false;document.addEventListener('keydown',event=>{if(event.key==='Escape')closeViewer()});if(items.length){show(0);setTimeout(()=>{for(let i=1;i<Math.min(items.length,8);i++)frameFor(i)},100)}
</script></body></html>
