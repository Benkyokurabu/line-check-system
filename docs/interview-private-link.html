<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面談案内リンクの流れ</title><style>body{font:17px/1.8 system-ui,sans-serif;color:#173d38;background:#edf5f2;margin:0;padding:24px}main{max-width:720px;margin:auto}section{background:white;border-radius:16px;padding:20px;margin:16px 0}h1{font-size:26px}button{font:inherit;background:#126555;color:white;border:0;border-radius:10px;padding:14px;cursor:pointer;width:100%}.arrow{text-align:center;font-size:24px}small{display:block;color:#53645c}</style><main><h1>LINEから面談を申し込む</h1><p>これは工藤だけに送る本番環境の検証用です。</p><section>勉たん<br><strong>生徒を選ぶ → 日程を選ぶ → 送信</strong></section><div class="arrow">↓</div><section><strong>案内LINE</strong><p>希望の日程を、以下のリンクからお選びください。</p><button id="open">面談の案内を開く（デモ）</button></section><div class="arrow">↓</div><section id="result" aria-live="polite">リンクを開くと、その案内の面談ページへ進みます。先生用のログインは不要です。</section><section><strong>権限の範囲</strong><p>その案内の日程選択・希望送信・取消だけ。先生画面や他の案内は開けません。</p><small>専用リンクを持つ人が利用できる方式です。LINEアカウントの本人認証とは異なります。一般保護者には送信しません。</small></section></main><script>document.querySelector('#open').onclick=()=>{document.querySelector('#result').innerHTML='<strong>面談予約</strong><p>第1希望から順に、最大3つ選んでください。</p><p>希望を送信 → 先生が承認 → 確定LINE</p>';};</script></html>
