<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出欠確認・LINE対象生徒の判定順</title>
  <style>
    body { max-width: 820px; margin: 32px auto; padding: 0 20px; font: 16px/1.7 system-ui, sans-serif; color: #243229; background: #f7f9f7; }
    h1 { font-size: 1.5rem; line-height: 1.3; }
    .flow { display: grid; gap: 10px; margin: 20px 0; }
    .step, .result { background: white; border: 1px solid #c9d7cc; border-radius: 10px; padding: 14px 18px; }
    .step strong { color: #087a3d; }
    .arrow { text-align: center; color: #087a3d; font-size: 1.5rem; line-height: 1; }
    .result { background: #ecfdf3; border-color: #86c99a; }
    label { display: block; font-weight: 700; margin: 26px 0 8px; }
    select { font: inherit; width: 100%; padding: 10px; border: 1px solid #9caf9f; border-radius: 8px; background: white; }
    .note { color: #596b5d; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>欠席・遅刻の対象生徒：LINE登録の判定順</h1>
  <div class="flow">
    <div class="step"><strong>① 本文に別の生徒が明記されている？</strong><br>確認済み登録と食い違うときは勝手に決めず、人に確認します。</div>
    <div class="arrow">↓</div>
    <div class="step"><strong>② 確認済みの生徒は何人？</strong><br>1人ならその生徒を確定。未確認登録や旧連携は、この確定を覆しません。</div>
    <div class="arrow">↓</div>
    <div class="step"><strong>③ 確認済みが複数・ゼロなら？</strong><br>本文で1人に絞れなければ、候補を表示して人が選択します。「兄弟姉妹」とは断定しません。</div>
  </div>
  <label for="case">動作例を選択</label>
  <select id="case">
    <option value="confirmed">Aさん確認済み＋Bさん未確認・旧連携</option>
    <option value="conflict">Aさん確認済み＋本文にBさんの名前</option>
    <option value="multiple">Aさん・Bさんの両方が確認済み</option>
    <option value="unverified">確認済みなし＋複数の旧候補</option>
  </select>
  <p id="result" class="result" role="status"></p>
  <p class="note">対象生徒の判定だけを変えます。LINE登録データの削除・変更や、Notionへの登録はこの判定では行いません。</p>
  <script>
    const outcomes = {
      confirmed: 'Aさんを対象生徒として表示し、不要な選択警告は出しません。',
      conflict: '本文と確認済み登録が食い違うため、対象生徒の確認を求めます。',
      multiple: '本文で特定できなければ、確認済みの2人から選択します。',
      unverified: '候補を表示して選択します。兄弟姉妹とは断定しません。',
    };
    const picker = document.getElementById('case');
    const result = document.getElementById('result');
    function render() { result.textContent = outcomes[picker.value]; }
    picker.addEventListener('change', render);
    render();
  </script>
</body>
</html>
