<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面談資料・高校候補の選択</title>
<style>body{font:16px/1.6 system-ui,sans-serif;background:#f2f7f5;color:#17333d;margin:0}main{max-width:780px;margin:auto;padding:24px}section{background:#fff;border:1px solid #bdd5cf;border-radius:12px;padding:22px;margin:16px 0}h1{font-size:1.6rem}h2{font-size:1.15rem}label{display:flex;gap:12px;align-items:start;border:1px solid #d5e2e3;border-radius:8px;padding:12px;margin:9px 0;cursor:pointer}input{width:22px;height:22px}small{display:block;color:#526770}strong{color:#07586b}.flow{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.flow span{padding:8px 12px;background:#e5f3ef;border-radius:8px}button{background:#07586b;color:white;border:0;border-radius:8px;padding:11px 18px;font:inherit}p{margin:8px 0}#selected{font-weight:700}@media(max-width:550px){main{padding:12px}section{padding:15px}}</style>
<main><h1>高校候補を複数選ぶ</h1><p>面談資料画面で、アンケートに志望校の記載がない中学2年生を選んだときの操作例です。</p>
<section><h2>情報の流れ</h2><div class="flow"><span>Notionの過去の面談記録</span>→<span>高校名を抽出</span>→<span>先生が複数チェック</span>→<span>資料を検索</span></div><p>記録の原文と出典を示し、選択してもアンケートの志望校は変更しません。</p></section>
<section><h2>過去の記録から見つかった高校</h2><label><input type="checkbox" value="大宮"><span><strong>大宮</strong><small>「大宮（普通科）の基準偏差値」・Notion原本</small></span></label><label><input type="checkbox" value="草加東"><span><strong>草加東</strong><small>「草加東高校が話題に出た」・Notion原本</small></span></label><p id="selected">選択中：なし</p><button type="button">選んだ高校の資料を確認</button></section>
</main><script>const boxes=[...document.querySelectorAll('input[type=checkbox]')];const output=document.getElementById('selected');boxes.forEach(box=>box.addEventListener('change',()=>{output.textContent='選択中：'+(boxes.filter(item=>item.checked).map(item=>item.value).join('、')||'なし')}));</script></html>
