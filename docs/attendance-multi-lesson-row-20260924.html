<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>欠席確認・1行で複数授業を選ぶ設計</title>
  <style>
    body { max-width: 880px; margin: 32px auto; padding: 0 20px; font: 16px/1.7 system-ui, sans-serif; color: #223029; background: #f6f8f6; }
    h1 { font-size: 1.6rem; line-height: 1.3; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    .card { background: white; border: 1px solid #ced8d0; border-radius: 12px; padding: 20px; margin: 18px 0; }
    .fields, .lessons, .records { display: flex; flex-wrap: wrap; gap: 10px; }
    .field { border: 1px solid #d4dcd6; border-radius: 8px; padding: 6px 12px; background: #fafcfa; }
    .lesson { border: 1px solid #aab7ad; border-radius: 8px; padding: 10px 16px; background: white; cursor: pointer; font: inherit; }
    .lesson[aria-pressed="true"] { border: 2px solid #16834c; padding: 9px 15px; background: #ecfdf3; }
    .arrow { text-align: center; font-size: 1.8rem; color: #347b54; }
    .record { border: 1px solid #b8d9c5; border-radius: 8px; padding: 8px 12px; background: #f2fbf5; }
    .muted { color: #5a6b60; }
  </style>
</head>
<body>
  <h1>欠席確認：1行で複数授業を選ぶ</h1>
  <p>授業ボタンは独立して切り替わります。選択中だけ緑、もう一度押すと白に戻ります。下の例をクリックして操作を確認できます。</p>
  <section class="card" aria-label="登録画面の例">
    <h2>登録する生徒と連絡内容</h2>
    <div class="fields"><span class="field">菊池 翔太</span><span class="field">9月24日</span><span class="field">欠席</span><span class="field">本校</span><span class="field">体調不良</span></div>
    <p>対象の授業（複数選択可）</p>
    <div class="lessons" id="lessons">
      <button class="lesson" type="button" aria-pressed="true" data-name="数学A">17:00 数学A</button>
      <button class="lesson" type="button" aria-pressed="false" data-name="英語B">19:00 英語B</button>
    </div>
  </section>
  <div class="arrow" aria-hidden="true">↓</div>
  <section class="card" aria-label="保存されるデータの例">
    <h2>Notion登録時</h2>
    <p class="muted">画面は1行でも、選択した授業ごとに1件ずつ登録します。未選択の授業は登録しません。</p>
    <div class="records" id="records"></div>
  </section>
  <p class="muted">同じ日の別の生徒、異なる校舎・種別・理由は別行として扱います。授業を1つも選ばずに登録することはできません。</p>
  <script>
    const buttons = [...document.querySelectorAll('.lesson')];
    const records = document.getElementById('records');
    function render() {
      const selected = buttons.filter(button => button.getAttribute('aria-pressed') === 'true');
      records.replaceChildren(...selected.map(button => {
        const element = document.createElement('span');
        element.className = 'record';
        element.textContent = `菊池 翔太｜9月24日｜${button.dataset.name}｜欠席`;
        return element;
      }));
      if (!selected.length) records.textContent = '未選択：登録前に授業を選んでください。';
    }
    buttons.forEach(button => button.addEventListener('click', () => {
      button.setAttribute('aria-pressed', String(button.getAttribute('aria-pressed') !== 'true'));
      render();
    }));
    render();
  </script>
</body>
</html>
