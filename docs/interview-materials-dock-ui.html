<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>面談資料の画面プレビュー案</title>
<style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#183039;background:#edf3f2}
*{box-sizing:border-box}body{margin:0}button{font:inherit}button:focus-visible{outline:3px solid #147b83;outline-offset:3px}
.shell{max-width:1240px;margin:0 auto;padding:28px 24px 70px}.top{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}
.eyebrow{margin:0 0 5px;color:#0a6970;font-size:12px;font-weight:800;letter-spacing:.1em}.top h1{margin:0;font-size:clamp(24px,3vw,35px);letter-spacing:-.03em}.top p:last-child{margin:7px 0 0;color:#526b72;line-height:1.55}
.demo-tag{flex:none;padding:8px 12px;border:1px solid #b9d8d3;border-radius:999px;color:#17655d;background:#e5f5ef;font-size:12px;font-weight:800}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:18px;align-items:start}.viewer{min-width:0;border:1px solid #cbdcda;border-radius:20px;background:#f8fbfa;box-shadow:0 15px 36px #17333d12;overflow:hidden}
.viewer-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 22px;border-bottom:1px solid #d7e5e2;background:#fff}.viewer-head strong{display:block;font-size:15px}.viewer-head small{display:block;margin-top:3px;color:#597078}.page-count{flex:none;color:#557178;font-size:12px;font-weight:700}
.paper-wrap{display:grid;place-items:start center;min-height:730px;padding:30px 36px 40px;background:linear-gradient(145deg,#edf3f2,#e2ecea)}.paper{width:min(100%,750px);min-height:640px;padding:42px 48px 52px;background:#fff;box-shadow:0 8px 24px #1c3c401b;color:#233641;animation:reveal .24s ease both}
.paper-top{display:flex;justify-content:space-between;align-items:start;gap:15px;padding-bottom:16px;border-bottom:2px solid #145f67}.paper-top h2{font-size:24px;margin:0}.paper-top span{font-size:11px;color:#5e747c}.student{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 26px;padding:13px 16px;border-radius:9px;background:#edf6f3;font-size:13px}.student strong{font-size:15px}
.paper h3{margin:26px 0 10px;font-size:16px;color:#195d64}.paper p{line-height:1.8}.qa{margin:15px 0 19px}.qa dt{margin:0;padding:10px 13px;border-radius:7px 7px 0 0;background:#e5f1ee;color:#145d64;font-size:13px;font-weight:800}.qa dd{margin:0;padding:13px 15px;border:1px solid #e0ebe8;border-top:0;border-radius:0 0 7px 7px;line-height:1.85}.table{width:100%;border-collapse:collapse;margin:15px 0;font-size:13px}.table th,.table td{border:1px solid #d7e4e2;padding:10px;text-align:left}.table th{background:#eaf3f1}.highlight{padding:15px;border-left:4px solid #278075;background:#f1f8f5;line-height:1.7}.bar-row{display:grid;grid-template-columns:78px 1fr 46px;gap:10px;align-items:center;margin:13px 0;font-size:13px}.bar{height:10px;border-radius:20px;background:#e0ece9;overflow:hidden}.bar i{display:block;height:100%;border-radius:20px;background:#2b8290}
.dock{position:sticky;top:18px;display:grid;justify-items:center;gap:12px;padding:17px 10px;border:1px solid #b8d2ce;border-radius:22px;background:#e3eeeb;box-shadow:0 12px 30px #183b3a16}.dock-title{font-size:11px;color:#526b70;font-weight:800;writing-mode:vertical-rl;letter-spacing:.15em;margin-bottom:5px}.dock-item{position:relative;display:grid;place-items:center;width:56px;height:56px;border:1px solid #b9d0cc;border-radius:15px;background:#fff;color:#1c5962;box-shadow:0 3px 9px #12384014;cursor:pointer;transform-origin:right center;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,background .22s ease;z-index:1}.dock-item:hover,.dock-item:focus-visible{transform:translateX(-7px) scale(1.24);box-shadow:0 8px 20px #0e484333;z-index:3}.dock-item.near{transform:translateX(-2px) scale(1.08);z-index:2}.dock-item[aria-pressed="true"]{background:#145f67;color:#fff;border-color:#145f67}.dock-icon{font-size:22px;font-weight:900;letter-spacing:-.08em}.dock-item::after{content:attr(data-label);position:absolute;right:calc(100% + 15px);top:50%;transform:translate(6px,-50%);opacity:0;pointer-events:none;white-space:nowrap;border-radius:7px;padding:8px 11px;background:#193e45;color:#fff;font-size:12px;font-weight:700;box-shadow:0 5px 14px #17333d30;transition:opacity .18s ease,transform .18s ease}.dock-item:hover::after,.dock-item:focus-visible::after{opacity:1;transform:translate(0,-50%)}.dock-item[aria-pressed="true"]::before{content:"";position:absolute;right:-15px;width:5px;height:23px;border-radius:5px;background:#147b83}
.explain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}.explain div{padding:16px;border:1px solid #cfdfdc;border-radius:12px;background:#fff}.explain strong{display:block;color:#115d65}.explain p{font-size:13px;line-height:1.65;margin:7px 0 0;color:#4e666c}
@keyframes reveal{from{opacity:.65;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:760px){.shell{padding:18px 10px 95px}.top{padding:0 5px}.workspace{display:flex;flex-direction:column;gap:0}.viewer{width:100%;border-radius:15px}.paper-wrap{min-height:620px;padding:14px 12px 25px}.paper{min-height:580px;padding:28px 22px 38px}.paper-top h2{font-size:20px}.dock{position:sticky;bottom:8px;top:auto;z-index:5;display:flex;justify-content:space-around;gap:5px;order:2;width:min(100%,560px);margin:10px auto 0;padding:9px;border-radius:18px}.dock-title{display:none}.dock-item{width:48px;height:48px;flex:none;border-radius:12px;transform-origin:center bottom}.dock-item:hover,.dock-item:focus-visible{transform:translateY(-5px) scale(1.1)}.dock-item.near{transform:none}.dock-item::after{display:none}.dock-item[aria-pressed="true"]::before{right:auto;bottom:-6px;width:20px;height:3px}.dock-icon{font-size:19px}.explain{grid-template-columns:1fr}}
@media(max-width:430px){.demo-tag{display:none}.viewer-head{padding:13px}.paper{padding:22px 16px}.dock-item{width:44px;height:44px}}
@media(prefers-reduced-motion:reduce){.dock-item,.dock-item::after,.paper{transition:none;animation:none}}
</style>
</head>
<body>
<main class="shell">
  <header class="top"><div><p class="eyebrow">INTERVIEW MATERIALS</p><h1>面談資料を画面で確認</h1><p>右側の資料ボタンにマウスを置くと拡大します。クリックで中央の資料を切り替えられます。</p></div><span class="demo-tag">操作見本・架空データ</span></header>
  <div class="workspace">
    <section class="viewer" aria-label="選択した資料のプレビュー">
      <div class="viewer-head"><div><strong id="current-title">面談アンケート回答</strong><small id="current-detail">回答日 2026年9月28日</small></div><span class="page-count" id="current-page">1 / 5 点</span></div>
      <div class="paper-wrap"><article class="paper" id="paper" aria-live="polite"></article></div>
    </section>
    <nav class="dock" aria-label="資料を切り替える">
      <span class="dock-title" aria-hidden="true">資料ドック</span>
      <button class="dock-item" type="button" data-doc="survey" data-label="アンケート回答" aria-label="アンケート回答を表示" aria-pressed="true"><span class="dock-icon" aria-hidden="true">問</span></button>
      <button class="dock-item" type="button" data-doc="guide" data-label="指導簿" aria-label="指導簿を表示" aria-pressed="false"><span class="dock-icon" aria-hidden="true">簿</span></button>
      <button class="dock-item" type="button" data-doc="hokushin" data-label="北辰の個人成績" aria-label="北辰の個人成績を表示" aria-pressed="false"><span class="dock-icon" aria-hidden="true">績</span></button>
      <button class="dock-item" type="button" data-doc="term" data-label="成績通知" aria-label="成績通知を表示" aria-pressed="false"><span class="dock-icon" aria-hidden="true">表</span></button>
      <button class="dock-item" type="button" data-doc="school" data-label="志望校資料" aria-label="志望校資料を表示" aria-pressed="false"><span class="dock-icon" aria-hidden="true">校</span></button>
    </nav>
  </div>
  <section class="explain" aria-label="操作の考え方"><div><strong>見たい資料へすぐ移動</strong><p>PDF全体をスクロールして探さず、右のボタンで資料を切り替えます。</p></div><div><strong>選択中が分かる</strong><p>開いている資料のボタンを濃い色で示します。マウスを置くと資料名も表示します。</p></div><div><strong>スマホでは下に配置</strong><p>ホバーできない画面では下部の大きなボタンをタップします。キーボード操作にも対応します。</p></div></section>
</main>
<template id="doc-survey"><div class="paper-top"><h2>面談アンケート回答</h2><span>回答日 2026.09.28</span></div><div class="student"><strong>中3　架空 花子</strong><span>担任：工藤</span></div><dl class="qa"><dt>第1志望校</dt><dd>柏の葉高校</dd></dl><dl class="qa"><dt>今の学習で困っていること</dt><dd>数学の文章題で、式を作るところに時間がかかります。<br>家では復習に取り組んでいます。</dd></dl><dl class="qa"><dt>面談で相談したいこと</dt><dd>入試までの学習計画と、志望校を決める時期について相談したいです。</dd></dl></template>
<template id="doc-guide"><div class="paper-top"><h2>指導簿</h2><span>2026年度</span></div><div class="student"><strong>中3　架空 花子</strong><span>本校</span></div><h3>学習状況</h3><table class="table"><tr><th>教科</th><th>現在の様子</th><th>面談で確認</th></tr><tr><td>英語</td><td>長文読解を継続</td><td>復習の進め方</td></tr><tr><td>数学</td><td>文章題を重点練習</td><td>式の立て方</td></tr><tr><td>国語</td><td>記述問題に取り組む</td><td>時間配分</td></tr></table><h3>先生のメモ</h3><p class="highlight">質問の多い単元を整理し、面談で家庭学習の時間を確認する。</p></template>
<template id="doc-hokushin"><div class="paper-top"><h2>北辰の個人成績</h2><span>2026年度 最新回</span></div><div class="student"><strong>中3　架空 花子</strong><span>第4回</span></div><h3>教科別の見取り</h3><div class="bar-row"><span>英語</span><span class="bar"><i style="width:72%"></i></span><strong>72</strong></div><div class="bar-row"><span>数学</span><span class="bar"><i style="width:58%"></i></span><strong>58</strong></div><div class="bar-row"><span>国語</span><span class="bar"><i style="width:65%"></i></span><strong>65</strong></div><h3>面談で確認</h3><p class="highlight">数学は解法を選ぶまでの時間を確認する。数値は見本です。</p></template>
<template id="doc-term"><div class="paper-top"><h2>成績通知</h2><span>2026年度 前期</span></div><div class="student"><strong>中3　架空 花子</strong><span>本人のページのみ</span></div><table class="table"><tr><th>教科</th><th>評価</th><th>学習の記録</th></tr><tr><td>国語</td><td>4</td><td>記述を継続</td></tr><tr><td>数学</td><td>3</td><td>文章題を重点練習</td></tr><tr><td>英語</td><td>4</td><td>長文読解を継続</td></tr></table><p class="highlight">個人成績表のうち、選んだ生徒のページを表示する想定です。</p></template>
<template id="doc-school"><div class="paper-top"><h2>志望校資料</h2><span>2027年度 高校案内</span></div><div class="student"><strong>第1志望　柏の葉高校</strong><span>学校別の資料</span></div><h3>確認する内容</h3><table class="table"><tr><th>項目</th><th>資料の場所</th></tr><tr><td>学校案内</td><td>2027年度版</td></tr><tr><td>入試選抜基準</td><td>最新の保存資料</td></tr><tr><td>偏差値の目安</td><td>北辰の基礎資料</td></tr></table><p class="highlight">実際の画面では、選択した学校の原本ページをここで確認する想定です。</p></template>
<script>
const titles={survey:['面談アンケート回答','回答日 2026年9月28日'],guide:['指導簿','2026年度 ／ 本校'],hokushin:['北辰の個人成績','2026年度 ／ 最新回'],term:['成績通知','2026年度 ／ 前期'],school:['志望校資料','第1志望 ／ 柏の葉高校']};
const buttons=[...document.querySelectorAll('.dock-item')];
function show(id){const index=buttons.findIndex(button=>button.dataset.doc===id);if(index<0)return;const template=document.getElementById('doc-'+id);document.getElementById('paper').replaceChildren(template.content.cloneNode(true));document.getElementById('current-title').textContent=titles[id][0];document.getElementById('current-detail').textContent=titles[id][1];document.getElementById('current-page').textContent=`${index+1} / ${buttons.length} 点`;for(const button of buttons)button.setAttribute('aria-pressed',String(button.dataset.doc===id));}
buttons.forEach((button,index)=>{button.addEventListener('click',()=>show(button.dataset.doc));button.addEventListener('pointerenter',()=>{buttons.forEach(other=>other.classList.remove('near'));if(index>0)buttons[index-1].classList.add('near');if(index<buttons.length-1)buttons[index+1].classList.add('near');});button.addEventListener('pointerleave',()=>buttons.forEach(other=>other.classList.remove('near')));button.addEventListener('keydown',event=>{if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();const next=(index+(event.key==='ArrowDown'||event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[next].focus();show(buttons[next].dataset.doc);});});
show('survey');
</script>
</body>
</html>
