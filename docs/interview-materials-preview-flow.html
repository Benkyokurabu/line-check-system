<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>面談資料：アンケート確認からPDF作成まで</title>
<style>
body{font-family:system-ui,sans-serif;max-width:980px;margin:auto;padding:24px;background:#f5f8f8;color:#172735}h1{font-size:1.6rem}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.steps span{background:#e3f3ef;border-radius:8px;padding:10px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #cadbdd;border-radius:12px;padding:18px}label{display:block;margin:12px 0}input{display:block;padding:9px;width:95%}button{background:#07586b;border:0;border-radius:8px;color:white;font:inherit;font-weight:bold;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5}#result{margin-top:18px;padding:12px;border-radius:8px;background:#eff9f6}dt{font-weight:bold}dd{margin:4px 0 12px}@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style>
<h1>面談資料の作成動線</h1>
<div class="steps"><span>1 生徒と回答を選ぶ</span><span>2 アンケートと志望順位を確認</span><span>3 資料の有無・年度を確認</span><span>4 PDFを作成・保存</span></div>
<div class="layout"><section class="card"><h2>アンケート回答</h2><dl><dt>現状の第一志望校</dt><dd>柏の葉</dd><dt>第二志望校</dt><dd>国府台</dd><dt>第三志望校</dt><dd>えいめい</dd></dl><p>原本は画面から開けます。</p></section>
<section class="card"><h2>志望順位の確認</h2><label>第1志望<input value="柏の葉"></label><label>第2志望<input value="国府台"></label><label>第3志望<input value="叡明"></label><p>「えいめい」は「叡明」として検索します。</p><button id="check">資料を作る</button><div id="result" role="status">ボタンを押すとNAS上の資料と年度を確認します。</div><p>高校入試選抜基準は該当する志望校の資料を加えます。北辰個人成績票は各PCで事前に索引化し、最新年度・最新回の本人のPDFだけを加えます。成績通知は学年に応じた最新年度・最新学期の本人の資料を加えます。</p><button id="create" disabled>PDFを作成</button></section></div>
<script>
document.getElementById('check').addEventListener('click',()=>{document.getElementById('result').innerHTML='第1 柏の葉：高校案内 2027年度、北辰偏差値資料 2026年度<br>第2 国府台：該当資料なし<br>第3 叡明：高校案内・高校入試選抜基準・推薦基準 2027年度、北辰偏差値資料 2026年度<br>北辰個人成績票：2026年度の最新回<br>成績通知：2026年度前期';document.getElementById('create').disabled=false});
document.getElementById('create').addEventListener('click',()=>{document.getElementById('result').textContent='PDFを作成しました。次にOneDriveへ保存します。'});
</script>
</html>
