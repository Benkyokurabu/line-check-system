name: Operation analysis
on:
  push:
    branches: [main]
    paths: ['src/lib/operation-*.mjs', 'src/lib/operation-observer.ts', 'src/components/operation-feedback*', 'src/app/api/operation-analysis/**', 'src/lib/staff-auth-http.ts', 'tests/operation-*.test.mjs', '.github/workflows/operation-analysis.yml']
  pull_request:
    paths: ['src/lib/operation-*.mjs', 'src/lib/operation-observer.ts', 'src/components/operation-feedback*', 'src/app/api/operation-analysis/**', 'src/lib/staff-auth-http.ts', 'tests/operation-*.test.mjs', '.github/workflows/operation-analysis.yml']
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/operation-*.test.mjs tests/staff-auth-core.test.mjs
