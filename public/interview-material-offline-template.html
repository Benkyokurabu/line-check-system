<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面談資料</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#173d43}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #147b83;outline-offset:3px}.landing{padding:24px}.landing button,.head button{padding:7px 12px;border:1px solid #9fbcb7;border-radius:8px;background:#fff;cursor:pointer}.viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:#dce7e5}.viewer[hidden]{display:none}.head{flex:none;min-height:54px;padding:7px 14px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border-bottom:1px solid #b8d1cc}.head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.head div{display:flex;align-items:center;gap:12px;flex:none}.head a{color:#07586b;font-size:.85rem}.area{position:relative;flex:1;min-height:0}.pdf{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden;pointer-events:none}.pdf.active{visibility:visible;pointer-events:auto}.dock{position:absolute;right:14px;top:50%;display:flex;flex-direction:column;gap:7px;max-height:calc(100% - 24px);padding:9px;overflow-y:auto;transform:translateY(-50%);border:1px solid #b6d0ca;border-radius:18px;background:#e6f1eeef;box-shadow:0 8px 28px #17333d30}.dock button{position:relative;width:106px;height:42px;flex:none;padding:0;border:1px solid #b6d0ca;border-radius:12px;background:#fff;color:#07586b;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:0 3px 9px #17333d16;transform-origin:right center;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s;cursor:pointer}.dock button:hover,.dock button:focus-visible{transform:translateX(-7px) scale(1.22);box-shadow:0 7px 17px #17333d2b;z-index:3}.dock button.near{transform:translateX(-2px) scale(1.06);z-index:2}.dock button[aria-pressed=true]{background:#07586b;color:#fff;border-color:#07586b}.dock button::after{content:attr(data-label);position:absolute;right:calc(100% + 14px);top:50%;width:max-content;max-width:220px;padding:7px 10px;border-radius:7px;background:#173d43;color:#fff;font-size:12px;line-height:1.4;white-space:normal;text-align:left;opacity:0;pointer-events:none;transform:translate(5px,-50%);transition:opacity .18s,transform .18s}.dock button:hover::after,.dock button:focus-visible::after{opacity:1;transform:translate(0,-50%)}.text-panel{position:absolute;inset:0;overflow:auto;padding:28px 145px 80px 28px;background:#f8fbfa;line-height:1.7}.text-panel[hidden]{display:none}.text-panel h2{margin:0 0 8px}.text-panel article,.text-panel dl>div{margin:16px 0;padding:18px;border:1px solid #d5e2e3;border-radius:10px;background:#fff}.text-panel article h3{margin:0}.text-panel article p{margin:3px 0 12px;color:#536870;font-size:.88rem}.text-panel .body,.text-panel dd{white-space:pre-wrap;overflow-wrap:anywhere}.text-panel dt{font-weight:700;color:#07586b}.text-panel dd{margin:5px 0 0}.text-panel a{color:#07586b}@media(max-width:700px){.head{gap:6px;padding:5px 8px}.head strong{font-size:.85rem}.head div{gap:5px}.head a{font-size:.7rem}.head button{padding:6px;font-size:.75rem}.dock{top:auto;right:8px;bottom:8px;left:8px;max-height:none;flex-direction:row;transform:none;overflow-x:auto;overflow-y:hidden}.dock button{width:98px;height:40px;font-size:13px;transform-origin:center bottom}.dock button:hover,.dock button:focus-visible{transform:translateY(-3px) scale(1.09)}.dock button::after{display:none}.text-panel{padding:20px 15px 85px}}@media(prefers-reduced-motion:reduce){.dock button,.dock button::after{transition:none}}
.landing{max-width:840px;margin:auto;line-height:1.7}.landing ul{padding-left:24px}.landing li{margin:8px 0;overflow-wrap:anywhere}.landing a{color:#07586b}.pdf-help{position:absolute;z-index:2;left:14px;bottom:14px;max-width:min(480px,calc(100% - 160px));margin:0;padding:10px 14px;border:1px solid #9fbcb7;border-radius:10px;background:#fffffff2;box-shadow:0 3px 12px #17333d25}.pdf-help[hidden]{display:none}.pdf-help a{font-weight:700;color:#07586b}@media(max-width:700px){.pdf-help{left:8px;bottom:76px;max-width:calc(100% - 16px);font-size:.85rem}}
</style></head><body>
<div class="landing"><h1 id="student-title">面談資料</h1><p>先生用の資料です。下の資料名からPDFを直接開けます。</p><button id="reopen" type="button">資料を画面で見る</button><h2>保存した資料</h2><ul id="saved-files"></ul><p><a href="staff-bundle.pdf" target="_blank" rel="noopener">印刷用の一式PDFを開く</a> ／ <a href="面談記録.txt" target="_blank" rel="noopener">面談記録の全文を開く</a> ／ <a href="生徒情報・注意点.txt" target="_blank" rel="noopener">生徒情報・注意点を開く</a></p></div>
<main class="viewer" id="viewer" aria-label="面談資料のプレビュー" hidden><header class="head"><strong id="title">面談資料</strong><div><a id="current-source" target="_blank" rel="noopener">このPDFを直接開く</a><a href="staff-bundle.pdf#zoom=100&navpanes=0" target="_blank" rel="noopener">一式PDFを表示・印刷</a><button id="close" type="button">← 表紙に戻る</button></div></header><div class="area" id="area"><section class="text-panel" id="text-panel" hidden></section><p class="pdf-help" id="pdf-help">PDFが枠内に表示されない場合は、<a id="direct-pdf" target="_blank" rel="noopener">このPDFを直接開く</a>から確認できます。</p><nav class="dock" id="dock" aria-label="資料を切り替える"></nav></div></main>
<script>
const items=__ITEMS_JSON__,studentName=__STUDENT_NAME_JSON__,context=__CONTEXT_JSON__,viewer=document.getElementById('viewer'),area=document.getElementById('area'),dock=document.getElementById('dock'),panel=document.getElementById('text-panel'),source=document.getElementById('current-source'),frames=new Map(),recent=[];
document.title=`${studentName}の面談資料`;document.getElementById('student-title').textContent=`${studentName}の面談資料`;
for(const [index,item] of items.entries()){const row=document.createElement('li'),link=document.createElement('a');link.href=`material-${index}.pdf`;link.target='_blank';link.rel='noopener';link.textContent=item.label;row.append(link);document.getElementById('saved-files').append(row)}
function short(item){const label=item.label;return item.kind|| (label.includes('アンケート')?'アンケート':label.includes('指導簿')?'指導簿':/晶文社|高校案内/.test(label)?'晶文社':/実施内容|選抜基準|推薦基準/.test(label)?'実施内容':/併願校|併願状況/.test(label)?'併願校':/北辰基礎資料|北辰偏差値資料/.test(label)?'北辰基礎資料':label.includes('北辰')?'北辰成績':label.includes('成績通知')?'塾内成績':label.includes('志望校')?'志望校':label.includes('Vもぎ')?'Vもぎ':'資料')}
const tabs=[...items.map((_,index)=>index),'records','info'];
const buttons=tabs.map((tab,index)=>{const label=typeof tab==='number'?short(items[tab]):tab==='records'?'面談記録':'情報',full=typeof tab==='number'?items[tab].label:label;const button=document.createElement('button');button.type='button';button.textContent=label;button.dataset.label=full;button.title=full;button.setAttribute('aria-label',`${full}を表示`);button.addEventListener('mousemove',()=>{buttons.forEach((other,i)=>other.classList.toggle('near',Math.abs(index-i)===1));show(tab)});button.addEventListener('mouseleave',()=>buttons.forEach(other=>other.classList.remove('near')));button.addEventListener('focus',()=>show(tab));button.addEventListener('click',()=>show(tab));button.addEventListener('keydown',event=>{if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();buttons[(index+(event.key==='ArrowDown'||event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length].focus()});dock.append(button);return button});
function frameFor(index){if(frames.has(index))return frames.get(index);const frame=document.createElement('iframe');frame.className='pdf';frame.title=`${items[index].label}のPDFプレビュー`;frame.src=`material-${index}.pdf#zoom=100&navpanes=0`;area.prepend(frame);frames.set(index,frame);recent.push(index);if(recent.length>12){const old=recent.shift();frames.get(old)?.remove();frames.delete(old)}return frame}
function addText(parent,tag,value){const element=document.createElement(tag);element.textContent=value;parent.append(element);return element}
function renderSummary(){if(context.summary?.status==='completed'){addText(panel,'h3','面談前に確認したい点（AI）');if(!context.summary.items.length)addText(panel,'p','特記する項目はありませんでした。');for(const item of context.summary.items){const article=document.createElement('article');addText(article,'strong',item.note);addText(article,'p',`出典：${item.source}`);panel.append(article)}}else addText(panel,'p','AIによる注意点の抽出は保存時点で完了していません。面談記録と生徒情報の原文を確認してください。')}
function renderRecords(){panel.replaceChildren();addText(panel,'h2','面談記録');addText(panel,'p','保存時にNotionから取得した直近3回の全文です。');renderSummary();if(!context.records.length)addText(panel,'p','面談記録は見つかりませんでした。');for(const record of context.records){const article=document.createElement('article');addText(article,'h3',record.title);const date=addText(article,'p',record.date||'日付なし');const link=document.createElement('a');link.href=record.url;link.target='_blank';link.rel='noopener';link.textContent=' 原本';date.append(link);if(record.method||record.purpose)addText(article,'p',`方法：${record.method||'記載なし'} ／ 目的：${record.purpose||'記載なし'}`);const body=addText(article,'div',record.body||'本文はありません。');body.className='body';if(record.attachments?.length)addText(article,'p',`添付ファイル：${record.attachments.join('、')}（原本から確認）`);panel.append(article)}}
function renderInfo(){panel.replaceChildren();addText(panel,'h2','情報');addText(panel,'p','保存時の生徒情報DBの記載です。');renderSummary();if(!context.info.length)addText(panel,'p','該当する記載はありません。');addText(panel,'h3','生徒情報DBの元の記載');const list=document.createElement('dl');for(const item of context.info){const row=document.createElement('div');addText(row,'dt',item.source);addText(row,'dd',item.value);list.append(row)}panel.append(list)}
function show(tab){const isPdf=typeof tab==='number';if(isPdf)frameFor(tab);for(const [i,frame] of frames)frame.classList.toggle('active',isPdf&&i===tab);buttons.forEach((button,i)=>button.setAttribute('aria-pressed',String(tabs[i]===tab)));panel.hidden=isPdf;if(tab==='records')renderRecords();if(tab==='info')renderInfo();document.getElementById('title').textContent=isPdf?items[tab].label:tab==='records'?'面談記録':'情報';const url=isPdf?`material-${tab}.pdf#zoom=100&navpanes=0`:tab==='records'?context.records[0]?.url:context.studentUrl;source.hidden=!url;if(url)source.href=url;source.textContent=isPdf?'このPDFを直接開く':'Notionの原本を開く';const help=document.getElementById('pdf-help');help.hidden=!isPdf;if(isPdf)document.getElementById('direct-pdf').href=`material-${tab}.pdf`}
function closeViewer(){viewer.hidden=true;document.getElementById('reopen').focus()}
document.getElementById('close').onclick=closeViewer;document.getElementById('reopen').onclick=()=>viewer.hidden=false;document.addEventListener('keydown',event=>{if(event.key==='Escape')closeViewer()});if(items.length){show(0);setTimeout(()=>{for(let i=1;i<Math.min(items.length,8);i++)frameFor(i)},100)}
</script></body></html>
