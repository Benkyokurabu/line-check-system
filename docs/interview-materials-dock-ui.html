<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面談資料のPDFプレビュー操作見本</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#173d43}.viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:#e5eeec}.viewer[hidden]{display:none}.head{min-height:55px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 16px;background:white;border-bottom:1px solid #bed3cf}.head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.head div{display:flex;align-items:center;gap:12px}.head a{color:#07586b;font-size:13px}.head button,.closed button{padding:7px 12px;border:1px solid #a9c6c0;border-radius:8px;background:white;cursor:pointer}.area{position:relative;flex:1;min-height:0}.pdf{position:absolute;inset:0;width:100%;height:100%;border:0;background:white;visibility:hidden;pointer-events:none}.pdf.active{visibility:visible;pointer-events:auto}.dock{position:absolute;right:15px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid #b9d0cc;border-radius:18px;background:#e3eeebed;box-shadow:0 8px 24px #17333d2b}.dock-item{position:relative;width:50px;height:50px;border:1px solid #b9d0cc;border-radius:12px;background:white;color:#1c5962;box-shadow:0 3px 9px #12384014;cursor:pointer;transform-origin:right center;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,background .22s}.dock-item:hover,.dock-item:focus-visible{transform:translateX(-7px) scale(1.22);box-shadow:0 8px 20px #0e484333;z-index:3}.dock-item.near{transform:translateX(-2px) scale(1.07);z-index:2}.dock-item[aria-pressed=true]{background:#145f67;color:white;border-color:#145f67}.dock-item::after{content:attr(data-label);position:absolute;right:calc(100% + 14px);top:50%;transform:translate(5px,-50%);opacity:0;pointer-events:none;white-space:normal;width:max-content;max-width:200px;border-radius:7px;padding:8px 11px;background:#193e45;color:white;font-size:12px;line-height:1.4;transition:opacity .18s,transform .18s}.dock-item:hover::after,.dock-item:focus-visible::after{opacity:1;transform:translate(0,-50%)}.closed{padding:24px}button:focus-visible,a:focus-visible{outline:3px solid #147b83;outline-offset:3px}@media(max-width:700px){.head{padding:5px 8px;gap:6px}.head a{font-size:11px}.head button{font-size:12px;padding:6px}.dock{top:auto;right:8px;bottom:8px;left:8px;transform:none;flex-direction:row;overflow-x:auto;gap:6px}.dock-item{width:43px;height:43px;flex:none;transform-origin:center bottom}.dock-item:hover,.dock-item:focus-visible{transform:translateY(-3px) scale(1.1)}.dock-item::after{display:none}}@media(prefers-reduced-motion:reduce){.dock-item,.dock-item::after{transition:none}}
.dock-item{width:106px;height:42px;font-size:14px;font-weight:700;white-space:nowrap}@media(max-width:700px){.dock-item{width:98px;height:40px;font-size:13px}}
</style></head><body>
<div class="closed"><h1>面談資料の操作見本</h1><button id="reopen" type="button">PDFプレビューを開く</button><p>架空データです。資料ごとに独立したPDFを表示します。</p></div>
<main class="viewer" id="viewer" aria-label="PDFプレビュー"><div class="head"><strong id="title">面談アンケート回答</strong><div><a id="open-pdf" href="interview-materials-dock-sample-1.pdf#zoom=100&navpanes=0" target="_blank" rel="noopener">このPDFを別画面で開く</a><button id="close" type="button">閉じる ×</button></div></div>
<div class="area" id="area"><nav class="dock" aria-label="資料を切り替える">
<button class="dock-item" data-label="面談アンケート回答" aria-label="面談アンケート回答を表示" aria-pressed="true">アンケート</button>
<button class="dock-item" data-label="指導簿" aria-label="指導簿を表示" aria-pressed="false">指導簿</button>
<button class="dock-item" data-label="北辰の個人成績" aria-label="北辰の個人成績を表示" aria-pressed="false">北辰</button>
<button class="dock-item" data-label="成績通知" aria-label="成績通知を表示" aria-pressed="false">塾内成績</button>
<button class="dock-item" data-label="志望校資料" aria-label="志望校資料を表示" aria-pressed="false">志望校</button>
</nav></div></main>
<script>
const buttons=[...document.querySelectorAll('.dock-item')],area=document.getElementById('area'),viewer=document.getElementById('viewer'),frames=[];
function select(index){const button=buttons[index],url=`interview-materials-dock-sample-${index+1}.pdf`,displayUrl=`${url}#zoom=100&navpanes=0`;if(!frames[index]){const frame=document.createElement('iframe');frame.className='pdf';frame.title=`${button.dataset.label}のPDFプレビュー`;frame.src=displayUrl;area.prepend(frame);frames[index]=frame;}frames.forEach((frame,i)=>frame.classList.toggle('active',i===index));buttons.forEach((item,i)=>item.setAttribute('aria-pressed',String(i===index)));document.getElementById('title').textContent=button.dataset.label;document.getElementById('open-pdf').href=displayUrl;}
buttons.forEach((button,index)=>{button.addEventListener('click',()=>select(index));button.addEventListener('pointerenter',()=>{buttons.forEach(item=>item.classList.remove('near'));if(index>0)buttons[index-1].classList.add('near');if(index<buttons.length-1)buttons[index+1].classList.add('near');select(index)});button.addEventListener('pointerleave',()=>buttons.forEach(item=>item.classList.remove('near')));button.addEventListener('focus',()=>select(index));button.addEventListener('keydown',event=>{if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();buttons[(index+(event.key==='ArrowDown'||event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length].focus()})});document.getElementById('close').onclick=()=>viewer.hidden=true;document.getElementById('reopen').onclick=()=>viewer.hidden=false;document.addEventListener('keydown',event=>{if(event.key==='Escape')viewer.hidden=true});select(0);
</script></body></html>
